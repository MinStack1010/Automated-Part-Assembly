
x-common: &common
  working_dir: /app
  ipc: host
  stdin_open: true
  tty: true
  environment: &default-env
    LIBGL_ALWAYS_SOFTWARE: "1"
    MPLBACKEND: Agg
  volumes: &default-volumes
    - .:/app
    # External joint_assembly dataset (optional): shadows the bundled
    # assets/joint_assembly sample when JOINT_ASSEMBLY_DIR is set, otherwise
    # mounts the in-repo sample onto itself (no-op).
    - ${JOINT_ASSEMBLY_DIR:-./assets/joint_assembly}:/app/assets/joint_assembly

services:
  api:
    build:
      context: .
      target: runtime
    image: assemble-them-all:latest
    # Native code (redmax_py) can segfault inside the uvicorn process -> the container
    # exits with 139. Restart automatically instead of letting the API die for good.
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      API_STORAGE_DIR: "/var/lib/assemble-them-all"
      ASSEMBLY_ASSETS_DIR: "/app/assets"
      API_MAX_WORKERS: "${API_MAX_WORKERS:-1}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      LIBGL_ALWAYS_SOFTWARE: "1"
      MPLBACKEND: Agg
    volumes:
      - api-data:/var/lib/assemble-them-all
      # Runtime asset mount: .dockerignore keeps the 2.4G multi_assembly (and
      # any external joint_assembly) out of the image, so the api service
      # reads them from the host instead of relying on a stale baked copy.
      - ./assets:/app/assets
      - ${JOINT_ASSEMBLY_DIR:-./assets/joint_assembly}:/app/assets/joint_assembly

  app:
    build:
      context: .
      target: runtime
    image: assemble-them-all:latest
    <<: *common
    command: sleep infinity

  # Attach the host's real X server to see the viewer window directly.
  # - Linux: DISPLAY=:0 (default); run `xhost +local:` first.
  # - macOS: install XQuartz, then run
  #     xhost +localhost
  #     DISPLAY=host.docker.internal:0 docker compose --profile gui run --rm gui python examples/test_joint_sim.py --id 00000
  gui:
    build:
      context: .
      target: runtime
    image: assemble-them-all:latest
    profiles: ["gui"]
    <<: *common
    environment:
      DISPLAY: "${DISPLAY:-:0}"
      XVFB_AUTOSTART: "0"
      LIBGL_ALWAYS_SOFTWARE: "1"
      MPLBACKEND: Agg
    volumes:
      - .:/app
      - ${JOINT_ASSEMBLY_DIR:-./assets/joint_assembly}:/app/assets/joint_assembly
      - /tmp/.X11-unix:/tmp/.X11-unix
    command: sleep infinity

  dev:
    build:
      context: .
      target: builder
    image: assemble-them-all:dev
    <<: *common
    command: sleep infinity

volumes:
  api-data:
