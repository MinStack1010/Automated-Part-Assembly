steps:
  # Build Docker image with lowercase name
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/synode-rc/automated-part-assembly:$COMMIT_SHA', '-t', 'gcr.io/synode-rc/automated-part-assembly:latest', '.']

  # Push image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/synode-rc/automated-part-assembly:$COMMIT_SHA']

  # Push latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/synode-rc/automated-part-assembly:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'automated-part-assembly'
      - '--image=gcr.io/synode-rc/automated-part-assembly:$COMMIT_SHA'
      - '--platform=managed'
      - '--region=asia-southeast1'
      - '--allow-unauthenticated'
      - '--port=8000'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=600s'
      # Jobs and uploads are instance-local until a shared store is introduced.
      - '--max-instances=1'
      - '--min-instances=1'
      - '--no-cpu-throttling'

# Specify images for Cloud Build tracking
images:
  - 'gcr.io/synode-rc/automated-part-assembly:$COMMIT_SHA'
  - 'gcr.io/synode-rc/automated-part-assembly:latest'

# Timeout 30 minutes because C++ build takes long
timeout: '1800s'
